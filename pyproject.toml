[project]
name = "intelligent-customer-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "'Harry", email = "'1265567590@qq.com'" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "dashscope>=1.27.7",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-socketio>=5.17.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "tqdm>=4.70.1",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
intelligent-customer-service = "app:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.uv.build-backend]
module-name = "app"
module-root = "src"
