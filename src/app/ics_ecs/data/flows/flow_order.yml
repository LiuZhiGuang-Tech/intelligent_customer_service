# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
# ↑ IDE 专用指令（yaml-language-server 的 modeline，必须写在文件首行）：
#   告诉 IDE 的 YAML 插件改用 JSON Schema draft-07 通用元 schema 校验本文件，
#   顶掉被误匹配的 Kestra 工作流 schema（后者强制要求 id/namespace/tasks，
#   对 Rasa flows 文件不适用，会报 "Missing property" 假告警）。
#   它只是注释，仅影响 IDE 校验提示，对框架训练与运行无任何影响。
# =============================================================================
# 订单 Flow 定义（flow_order.yml）
# =============================================================================
# 文件作用：定义电商客服订单域的业务流程——切换账号、查询订单详情、修改
#           订单收货信息、取消订单；训练时由框架加载为可执行流程图。
# 执行流程：rasa 训练/启动时读取本文件，逐个 flow 解析为步骤序列；
#           运行时 LLMCommandGenerator 依 description 匹配流程并 StartFlow，
#           FlowPolicy 按 steps 顺序执行——collect 收集槽位、action 执行
#           动作、next 按 if-then-else 跳转，END 表示流程结束。
# 副作用：步骤调用的自定义 Action（action_ask_* / action_get_order_detail /
#         action_cancel_order 等）会查询或修改 MySQL 订单与收货信息表。
# 主要依赖：domain.yml（槽位与 Action 注册）、actions/（自定义 Action 实现）。
# 备注：适配 ics_ai 框架 Flow 语法，复刻参考实现。
#
# ------------------------------ 键名约定速查表 -------------------------------
# | 键名               | 含义                       | 取值约定                   |
# | version            | 训练数据格式版本           | 固定 "3.1"                 |
# | flows              | Flow 定义容器              | 键为流程 ID（英文小写）    |
# | name               | 流程显示名                 | 中文短句                   |
# | description        | 流程描述（LLM 匹配依据）   | 罗列用户典型说法           |
# | persisted_slots    | 流程结束后不重置的槽位     | 槽位名列表                 |
# | steps              | 步骤序列                   | 顺序执行，next 控制跳转    |
# | collect            | 收集槽位步骤               | 槽位名                     |
# | set_slots          | 预设槽位步骤               | 槽位名: 值 或 goto 列表    |
# | goto               | 经 Action 预填槽位         | Action 名                  |
# | id                 | 步骤标识（跳转目标）       | 流程内唯一                 |
# | action             | 执行自定义 Action 步骤     | Action 名                  |
# | ask_before_filling | 填充前是否强制重新询问     | true / false               |
# | next               | 后续步骤或条件分支         | 步骤 ID / END / if-then-else |
# | if / then / else   | 条件分支                   | slots.<槽位> 表达式        |
# -----------------------------------------------------------------------------
# 哨兵值约定：自定义 Action 会向槽位写入特定字符串作为状态标记——
#   order_id   = "false"    用户未选中任何有效订单（放弃选择）
#   receive_id = "false"    用户放弃修改收货信息
#   receive_id = "modify"   用户选择"修改并新建收货信息"
#   receive_id = "modified" 本轮已至少完成一项内容修改
# =============================================================================

# 训练数据格式版本：3.1 为 Rasa flows 语法版本，保持默认即可。
version: "3.1"

# Flow 定义容器：每个一级键为一个业务流程，流程间相互独立。
flows:
  # ============================== 流程1：切换账号 ==============================
  # 测试用功能：切换账号
  switch_user_id:
    # 流程显示名：Inspect 页面与日志中展示的名称。
    name: 切换账号
    # 流程描述：LLM 据此判断用户消息是否命中本流程（含典型说法）。
    description: 切换账号、切换用户、更换用户ID
    # 流程结束后不重置下列槽：用户身份跨流程/跨会话保留，
    # 否则每次查询订单都要重新报 ID。
    persisted_slots:
      # 列表项1：user_id——账号身份槽位，持久保留。
      - user_id
    # 步骤序列：本流程仅收集用户 ID 一步。
    steps:
      # 步骤1：收集 user_id 槽位（自动触发对应询问）。
      - collect: user_id
        # 槽位描述：生成询问话术与 LLM 提取的依据。
        description: 用户id
        # 填充前强制询问：每次进入流程都重新询问，避免残留旧 ID。
        ask_before_filling: true
        # 收集完成即结束流程。
        next: END

  # ============================ 流程2：查询订单详情 ============================
  # 查询订单详情，严格按照以下设定的业务流程
  query_order_detail:
    # 流程显示名。
    name: 查询订单详情
    # 流程描述：LLM 匹配依据。
    description: 查询订单详情
    # 步骤序列。
    steps:
      # 步骤1：预设槽位——查询进行中，或3日内已完成的订单。
      - set_slots:
          # 列表项1：goto 调用该 Action，查库筛出"进行中或3日内已完成"
          # 的候选订单，经按钮写入 order_id 供用户选择。
          - goto: action_ask_order_id_before_completed_3_days
      # 步骤2：收集 order_id——button 展示给用户，用户选择一个订单。
      - collect: order_id
        # 条件跳转：根据用户是否选中订单分流。
        next:
          # 列表项1（条件）：选择的订单id不是false（哨兵值=未选中有效订单），
          # 进行下一步。
          - if: slots.order_id != "false"
            # 条件成立分支。
            then:
              # 执行action，查询此订单的详情。
              - action: action_get_order_detail
                # 详情回复后流程结束。
                next: END
          # 列表项2（否则）：未选中订单（order_id=false），直接结束。
          - else: END

  # ========================== 流程3：修改订单收货信息 ==========================
  # 修改订单收货信息，严格按照以下设定的业务流程
  modify_order_receive_info:
    # 流程显示名。
    name: 修改订单收货信息
    # 流程描述：LLM 匹配依据。
    description: 修改订单收货信息
    # 步骤序列。
    steps:
      # 步骤1：预设槽位——查询已签收之前状态的订单，这些订单才能修改信息。
      - set_slots:
          # 列表项1：goto 调用该 Action，查库筛出"未签收"的候选订单
          # 写入 order_id 供用户选择。
          - goto: action_ask_order_id_before_delivered
      # 步骤2：收集 order_id——button 展示给用户，用户选择一个订单。
      - collect: order_id
        # 条件跳转。
        next:
          # 列表项1（条件）：选中了有效订单。
          - if: slots.order_id != "false"
            # 条件成立：跳转到id为get_order_detail的步骤，显示订单详情。
            then: get_order_detail
          # 列表项2（否则）：未选中订单，直接结束。
          - else: END
      # 步骤3（id: get_order_detail）：查询此订单的详情。
      - id: get_order_detail
        # 执行查询详情 Action。
        action: action_get_order_detail
      # 步骤4：收集 receive_id——自动调用action_ask_receive_id，
      # button显示现有的收货信息 或 修改并新建收货信息。
      - collect: receive_id
        # 每次都重新询问，避免槽位残留。
        ask_before_filling: true
        # 三路条件跳转。
        next:
          # 列表项1（条件）：如果receive_id=false,直接流程结束。
          - if: slots.receive_id == "false"
            # 放弃修改，结束。
            then: END
          # 列表项2（条件）：如果receive_id=modify，选择修改订单收货信息的内容。
          - if: slots.receive_id == "modify"
            # 跳转到id为select_modify_content的步骤，选择修改内容。
            then: select_modify_content
          # 列表项3（否则）：选择现有的收货信息，跳转到id为confirm_receive_info
          # 的步骤，询问是否确认修改订单收货信息。
          - else: confirm_receive_info
      # 步骤5（id: select_modify_content）：选择修改订单收货信息的内容。
      - id: select_modify_content
        # 收集修改内容，自动调用utter_ask_modify_content，button显示修改内容。
        collect: modify_content
        # 清空槽位重新填充：避免上一轮选择残留。
        ask_before_filling: true
        # 按修改内容多路跳转。
        next:
          # 列表项1（条件）：如果modify_content=收货人姓名，收集收货人姓名。
          - if: slots.modify_content == "收货人姓名"
            # 条件成立分支。
            then:
              # 收集收货人姓名，自动调用 utter_ask_receiver_name。
              - collect: receiver_name
                # 槽位描述：生成询问话术的依据。
                description: 姓名
                # 清空槽位重新填充。
                ask_before_filling: true
                # 跳转到id为if_modify_continue的步骤，询问是否继续修改其他内容。
                next: if_modify_continue
          # 列表项2（条件）：如果modify_content=收货人电话，收集收货人电话。
          - if: slots.modify_content == "收货人电话"
            # 条件成立分支。
            then:
              # 收集收货人电话，自动调用 utter_ask_receiver_phone。
              - collect: receiver_phone
                # 槽位描述：手机号码（用于询问话术与提取校验）。
                description: 手机号码
                # 清空槽位重新填充。
                ask_before_filling: true
                # 跳转到id为if_modify_continue的步骤。
                next: if_modify_continue
          # 列表项3（条件）：如果modify_content=收货地址，逐级收集地址。
          - if: slots.modify_content == "收货地址"
            # 条件成立分支。
            then:
              # 收集收货地址的省份，自动调用 action_ask_receive_province，
              # action而不是utter因为要查表（省列表来自数据库）。
              - collect: receive_province
                # 清空槽位重新填充。
                ask_before_filling: true
              # 收集收货地址的城市，自动调用 action_ask_receive_city，
              # action而不是utter因为要查表（按省联动查城市）。
              - collect: receive_city
                # 清空槽位重新填充。
                ask_before_filling: true
              # 收集收货地址的区县，自动调用 action_ask_receive_district，
              # action而不是utter因为要查表（按市联动查区县）。
              - collect: receive_district
                # 清空槽位重新填充。
                ask_before_filling: true
              # 收集收货地址的街道地址，自动调用 utter_ask_receive_street_address，
              # 需要询问，让用户输入（自由文本，无需查表）。
              - collect: receive_street_address
                # 槽位描述：街道地址。
                description: 街道地址
                # 清空槽位重新填充。
                ask_before_filling: true
                # 收集完收货地址后，跳转到id为if_modify_continue的步骤，
                # 询问是否继续修改其他内容。
                next: if_modify_continue
          # 列表项4（条件）：如果之前已经修改过内容（receive_id=modified），
          # 但是再次修改其他内容时选择了取消，回确认步骤。
          - if: slots.receive_id == "modified"
            # 跳转到确认收货信息步骤。
            then: confirm_receive_info
          # 列表项5（否则）：首次进入且未选择有效内容，结束流程。
          - else: END
      # 步骤6（id: if_modify_continue）：询问是否继续修改。
      - id: if_modify_continue
        # 收集是否继续修改内容，自动调用 utter_ask_if_modify_continue，
        # button显示是/否。
        collect: if_modify_continue
        # 清空槽位重新填充。
        ask_before_filling: true
        # 按用户选择跳转。
        next:
          # 列表项1（条件）：确认继续修改内容。
          - if: slots.if_modify_continue
            # 条件成立分支。
            then:
              # 先把 receive_id 置为 modified，表示已经修改过内容，
              # 再进入选择修改内容步骤。
              - set_slots:
                  # 设置receive_id为modified（状态标记，见文件头哨兵值约定）。
                  - receive_id: modified
                # 跳转到id为select_modify_content的步骤，选择修改内容。
                next: select_modify_content
          # 列表项2（否则）：不继续修改内容，跳转到id为confirm_receive_info
          # 的步骤，询问是否确认收货信息。
          - else: confirm_receive_info
      # 步骤7（id: confirm_receive_info）：确认修改订单收货信息。
      - id: confirm_receive_info
        # 收集 是否确认修改后的订单收货信息，自动调用 action_ask_set_receive_info，
        # 返回button显示是/否。
        collect: set_receive_info
        # 清空槽位重新填充。
        ask_before_filling: true
        # 按用户确认结果跳转。
        next:
          # 列表项1（条件）：确认修改后的订单收货信息。
          - if: slots.set_receive_info
            # 条件成立分支。
            then:
              # 执行action_ask_set_receive_info，执行新收货信息的入库。
              - action: action_ask_set_receive_info
                # 入库完成后流程结束。
                next: END
          # 列表项2（否则）：用户不确认，直接结束（不入库）。
          - else: END

  # ============================== 流程4：取消订单 ==============================
  # 取消订单，严格按照以下设定的业务流程
  cancel_order:
    # 流程显示名。
    name: 取消订单
    # 流程描述：LLM 匹配依据。
    description: 取消订单
    # 步骤序列。
    steps:
      # 步骤1：预设槽位——查询待支付或待发货的订单（仅这些状态可取消）。
      - set_slots:
          # 列表项1：goto 调用该 Action，查库筛出可取消的候选订单
          # 写入 order_id 供用户选择。
          - goto: action_ask_order_id_before_shipped
      # 步骤2：收集 order_id——button 展示给用户，用户选择一个订单。
      - collect: order_id
        # 条件跳转。
        next:
          # 列表项1（条件）：选中了有效订单。
          - if: slots.order_id != "false"
            # 跳转到id为get_order_detail的步骤，查询此订单的详情。
            then: get_order_detail
          # 列表项2（否则）：未选中订单，直接结束。
          - else: END
      # 步骤3（id: get_order_detail）：查询此订单的详情。
      - id: get_order_detail
        # 执行查询详情 Action。
        action: action_get_order_detail
      # 步骤4：询问是否取消订单，自动调用utter_ask_if_cancel_order，
      # button显示是/否。
      - collect: if_cancel_order
        # 按用户确认结果跳转。
        next:
          # 列表项1（条件）：确认取消订单。
          - if: slots.if_cancel_order
            # 条件成立分支。
            then:
              # 执行action_cancel_order，执行订单的取消。
              - action: action_cancel_order
                # 取消完成后流程结束。
                next: END
          # 列表项2（否则）：用户不确认，直接结束（订单保留）。
          - else: END
